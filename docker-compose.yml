services:
  api:
    build:
      context: .
      dockerfile: src/localizationApp.API/Dockerfile
    container_name: localizationapp-api
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DOTNET_RUNNING_IN_CONTAINER=true
    volumes:
      - api-data:/app/data
    networks:
      - localizationapp-network

  client:
    build:
      context: .
      dockerfile: src/localizationApp.Client/Dockerfile
    container_name: localizationapp-client
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiBaseUrl=http://api:8080
    depends_on:
      - api
    networks:
      - localizationapp-network

networks:
  localizationapp-network:
    driver: bridge

volumes:
  api-data: